[project]
name = "bedashing-network-intelligence"
version = "0.1.0"
description = "AI-enabled geospatial decision support for retail network right-sizing"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "shapely>=2.0",
    "h3>=4.1",
    "pydantic>=2.7",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false
