name: deploy

# Deploys only from main, and only after CI has passed on that commit. The
# gate is deliberate: the dataset-reproducibility check in CI is what stops a
# build going out whose "How this works" panel describes a different model
# from the one that produced its numbers.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  pages:
    name: Cloudflare Pages
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          # --branch=main is load-bearing. Without it wrangler tries to infer
          # the branch from git, and this is a detached checkout at a specific
          # sha, so it infers nothing and publishes a PREVIEW deployment. The
          # run goes green, a URL is printed, and the live site silently never
          # moves — which is exactly what happened before this flag existed.
          #
          # OPENAI_API_KEY is NOT set here. It is a Pages project secret, read
          # by the Function at request time, so it never enters the build or
          # this repository.
          command: pages deploy dist --project-name=bedashing-network-intelligence --branch=main

      - name: Verify the deployment became production
        # The failure this job is most likely to have is a deploy that
        # succeeds without becoming the production deployment. That is
        # indistinguishable from success at a glance, so it is asserted rather
        # than assumed.
        #
        # Deliberately no HTTP request to the site: Cloudflare's bot
        # protection answers 403 to requests from datacenter IP ranges, so a
        # curl from a GitHub runner fails against a perfectly healthy site.
        # A check that cries wolf is worse than no check, and the Cloudflare
        # API answers the question directly.
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/bedashing-network-intelligence"
          live=""
          stage=""

          # Promotion to canonical is not instant, so poll rather than guess a
          # sleep long enough to be safe and short enough to be quick.
          #
          # The response goes to a file rather than through a pipe: Cloudflare
          # embeds the raw commit message, which for this repository contains
          # newlines, and piping it through `echo` in a shell that expands
          # backslash escapes corrupts the JSON before the parser sees it.
          for attempt in $(seq 1 12); do
            if curl -sf "$api" -H "Authorization: Bearer $CF_TOKEN" -o project.json; then
              live=$(jq -r '.result.canonical_deployment.deployment_trigger.metadata.commit_hash // ""' project.json)
              stage=$(jq -r '(.result.canonical_deployment.latest_stage.name // "?") + "/" + (.result.canonical_deployment.latest_stage.status // "?")' project.json)
            fi
            echo "attempt $attempt: production=${live:-unknown} stage=${stage:-unknown}"
            [ "$live" = "$EXPECTED_SHA" ] && break
            sleep 10
          done

          if [ "$live" != "$EXPECTED_SHA" ]; then
            echo "::error::Production is serving ${live:-nothing}, not $EXPECTED_SHA. The deploy most likely went to a preview environment — check that the deploy command passes --branch=main."
            exit 1
          fi

          if [ "$stage" != "deploy/success" ]; then
            echo "::error::Production is $EXPECTED_SHA but its latest stage is $stage"
            exit 1
          fi

          {
            echo "### Deployed to production"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| commit | \`$EXPECTED_SHA\` |"
            echo "| stage | $stage |"
            echo "| live | https://2pz.larri.dev |"
          } >> "$GITHUB_STEP_SUMMARY"
