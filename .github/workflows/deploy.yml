name: deploy

# Deploys only from main, and only after CI has passed on that commit. The
# gate is deliberate: the dataset-reproducibility check in CI is what stops a
# build going out whose "How this works" panel describes a different model
# from the one that produced its numbers.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  pages:
    name: Cloudflare Pages
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          # OPENAI_API_KEY is NOT set here. It is a Pages project secret, read
          # by the Function at request time, so it never enters the build or
          # this repository.
          command: pages deploy dist --project-name=bedashing-network-intelligence
