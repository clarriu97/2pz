name: build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The pipeline's output is committed, so CI does not need network access or
  # any API key to verify the product builds. It only checks that the Python
  # that produced the data still runs and that the committed data matches what
  # the pipeline produces from the committed caches.
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check pipeline
      - name: Rebuild data from committed caches
        run: uv run python -m pipeline.run
      - name: Fail if the committed dataset is not reproducible
        run: |
          if ! git diff --quiet -- data/processed web/public/data; then
            echo "::error::Re-running the pipeline changed the committed data."
            git diff --stat -- data/processed web/public/data
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    needs: pipeline
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Typecheck & build
        run: npm run build
        working-directory: web

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=bedashing-network-intelligence
